<!doctype html><html><body style="margin:0;background:#2a3350">
<canvas id="c" width="1600" height="1000"></canvas>
<script type="module">
import { createPawn } from '/src/sim/pawn.js';
import { loadCharacterPack, packSheet, PW, PH } from '/src/render/charpack.js';
import { RNG } from '/src/core/rng.js';
await loadCharacterPack('/assets/packs/characters/');
const ctx = document.getElementById('c').getContext('2d'); ctx.imageSmoothingEnabled = false;
const rng = new RNG(+(new URLSearchParams(location.search).get('seed') || 3));
const S = 3;
for (let row = 0; row < 5; row++) for (let col = 0; col < 10; col++) {
  const era = row * 2 + (col >= 5 ? 1 : 0);
  const p = createPawn(rng, { age: rng.range(18, 70), region: rng.next(), race: ['human','human','elf','orc'][row % 4] });
  p.role = ['citizen', 'soldier', 'doctor', 'citizen', 'leader'][col % 5];
  if (col === 3) p.role = 'prophet';
  const { sheet } = packSheet(p, era, '#4fb0ff');
  const dir = [2, 2, 2, 1, 3][col % 5], frame = [0, 8, 0, 3, 0][col % 5];
  ctx.drawImage(sheet, frame * PW, dir * PH, PW, PH, 10 + col * 158, 10 + row * 195, PW * S, PH * S);
  ctx.fillStyle = '#fff'; ctx.font = '12px sans-serif'; ctx.fillText(`${p.race} e${era} ${p.sex} ${p.role} fat${p.look.fat.toFixed(1)}`, 10 + col * 158, 190 + row * 195);
}
document.title = 'done';
</script></body></html>
